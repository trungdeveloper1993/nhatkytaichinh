<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nhật Ký Tài Chính</title>
    <meta name="description" content="Hãy quản lý túi tiền của bạn nhé ❤️ Ghi chép thu chi, quản lý quỹ, gợi ý phân bổ thu nhập và báo cáo — dữ liệu nằm ngay trên thiết bị của bạn." />
    <meta name="theme-color" content="#f5f7ff" />
    <!-- Không tự biến số tài khoản / số tiền thành số điện thoại trên iPhone -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Cài lên màn hình chính (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Nhật Ký Tài Chính" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tài Chính" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Font: tải song song với ứng dụng (thay cho @import trong CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
